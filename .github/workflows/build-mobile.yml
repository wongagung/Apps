name: Build Mobile Apps (Android APK & iOS IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew || true
          gradle wrapper
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirCast-Pro-Android-APK
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

  build-ios:
    name: 🍏 Build iOS IPA / WebClip
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Package iOS WebClip & Standalone Bundle
        run: |
          mkdir -p build/ios-payload/Payload
          cp -r src/mobile build/ios-payload/Payload/AirCastPro.app
          cd build/ios-payload
          zip -r ../../AirCast-Pro.ipa Payload
          echo "iOS IPA package created successfully"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirCast-Pro-iOS-IPA
          path: AirCast-Pro.ipa
          if-no-files-found: warn


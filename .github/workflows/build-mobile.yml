name: Build Mobile Apps (Android APK & iOS IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android APK
        working-directory: mobile-app/android
        run: |
          gradle assembleDebug --stacktrace

      - name: Rename APK for Easy Download
        run: |
          cp mobile-app/android/app/build/outputs/apk/debug/app-debug.apk AirCast-Pro.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirCast-Pro-Android-APK
          path: AirCast-Pro.apk
          if-no-files-found: error

  build-ios:
    name: 🍏 Build iOS IPA Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Package iOS IPA & Standalone App
        run: |
          mkdir -p Payload/AirCastPro.app
          cp -r src/mobile/* Payload/AirCastPro.app/
          zip -r AirCast-Pro.ipa Payload
          echo "iOS IPA package created successfully"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AirCast-Pro-iOS-IPA
          path: AirCast-Pro.ipa
          if-no-files-found: error
